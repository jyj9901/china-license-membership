<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중국 운전면허 문제은행 | 로그인</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="icon">🚗</div>
    <h1>중국 운전면허 문제은행</h1>
    <p>한국인을 위한 중국 운전면허 필기시험 대비</p>
  </div>

  <div class="card">
    <button class="btn" id="googleBtn" onclick="doGoogleLogin()" style="background:#fff;color:#3c4043;border:1px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      구글로 계속하기
    </button>
    <div style="text-align:center;color:var(--muted,#888);font-size:12px;margin:6px 0 16px;">또는 이메일로</div>

    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">로그인</div>
      <div class="tab" id="tabSignup" onclick="switchTab('signup')">회원가입</div>
    </div>

    <!-- 로그인 폼 -->
    <div id="loginForm">
      <label for="loginEmail">이메일</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
      <label for="loginPw">비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호">
      <button class="btn" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- 회원가입 폼 -->
    <div id="signupForm" style="display:none;">
      <label for="suEmail">이메일</label>
      <input type="email" id="suEmail" placeholder="you@example.com">
      <label for="suPw">비밀번호 (6자 이상)</label>
      <input type="password" id="suPw" placeholder="비밀번호">
      <button class="btn green" id="signupBtn" onclick="doSignup()">회원가입</button>
      <div class="msg" id="signupMsg"></div>
    </div>
  </div>

  <div class="foot-note">
    가입 후 결제를 완료하면 전체 문제은행(연습모드 · 오답노트)을<br>이용하실 수 있습니다.
  </div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
function switchTab(t) {
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabSignup').classList.toggle('active', t==='signup');
  document.getElementById('loginForm').style.display = t==='login' ? 'block' : 'none';
  document.getElementById('signupForm').style.display = t==='signup' ? 'block' : 'none';
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'error');
}

async function doGoogleLogin() {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/index.html' }
  });
  if (error) alert('구글 로그인 실패: ' + error.message);
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPw').value;
  if (!email || !password) return showMsg('loginMsg', '이메일과 비밀번호를 입력해주세요.', false);

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>로그인 중...';

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = '로그인';

  if (error) return showMsg('loginMsg', '로그인 실패: ' + error.message, false);

  // 결제 여부 확인 후 이동
  const { data: profile } = await supabaseClient
    .from('profiles').select('is_paid').eq('id', data.user.id).single();

  window.location.href = (profile && profile.is_paid) ? 'study.html' : 'pay.html';
}

async function doSignup() {
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPw').value;
  if (!email || !password) return showMsg('signupMsg', '이메일과 비밀번호를 입력해주세요.', false);
  if (password.length < 6) return showMsg('signupMsg', '비밀번호는 6자 이상이어야 합니다.', false);

  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>가입 중...';

  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  btn.disabled = false; btn.textContent = '회원가입';

  if (error) return showMsg('signupMsg', '가입 실패: ' + error.message, false);

  showMsg('signupMsg', '가입 완료! 결제 페이지로 이동합니다...', true);
  setTimeout(() => { window.location.href = 'pay.html'; }, 1200);
}

// 이미 로그인 + 결제된 상태라면 바로 study.html로
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    const { data: profile } = await supabaseClient
      .from('profiles').select('is_paid').eq('id', session.user.id).single();
    if (profile && profile.is_paid) window.location.href = 'study.html';
  }
})();
</script>
</body>
</html>
