<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중국 운전면허 문제은행 | 로그인</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="icon">🚗</div>
    <h1>중국 운전면허 문제은행</h1>
    <p>한국인을 위한 중국 운전면허 필기시험 대비</p>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">로그인</div>
      <div class="tab" id="tabSignup" onclick="switchTab('signup')">회원가입</div>
    </div>

    <!-- 로그인 폼 -->
    <div id="loginForm">
      <label for="loginEmail">이메일</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
      <label for="loginPw">비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호">
      <button class="btn" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- 회원가입 폼 -->
    <div id="signupForm" style="display:none;">
      <label for="suEmail">이메일</label>
      <input type="email" id="suEmail" placeholder="you@example.com">
      <label for="suPw">비밀번호 (6자 이상)</label>
      <input type="password" id="suPw" placeholder="비밀번호">
      <button class="btn green" id="signupBtn" onclick="doSignup()">회원가입</button>
      <div class="msg" id="signupMsg"></div>
    </div>
  </div>

  <div class="foot-note">
    가입 후 결제를 완료하면 전체 문제은행(연습모드 · 오답노트)을<br>이용하실 수 있습니다.
  </div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
function switchTab(t) {
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabSignup').classList.toggle('active', t==='signup');
  document.getElementById('loginForm').style.display = t==='login' ? 'block' : 'none';
  document.getElementById('signupForm').style.display = t==='signup' ? 'block' : 'none';
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'error');
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPw').value;
  if (!email || !password) return showMsg('loginMsg', '이메일과 비밀번호를 입력해주세요.', false);

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>로그인 중...';

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = '로그인';

  if (error) return showMsg('loginMsg', '로그인 실패: ' + error.message, false);

  // 결제 여부 확인 후 이동
  const { data: profile } = await supabaseClient
    .from('profiles').select('is_paid').eq('id', data.user.id).single();

  window.location.href = (profile && profile.is_paid) ? 'study.html' : 'pay.html';
}

async function doSignup() {
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPw').value;
  if (!email || !password) return showMsg('signupMsg', '이메일과 비밀번호를 입력해주세요.', false);
  if (password.length < 6) return showMsg('signupMsg', '비밀번호는 6자 이상이어야 합니다.', false);

  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>가입 중...';

  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  btn.disabled = false; btn.textContent = '회원가입';

  if (error) return showMsg('signupMsg', '가입 실패: ' + error.message, false);

  showMsg('signupMsg', '가입 완료! 결제 페이지로 이동합니다...', true);
  setTimeout(() => { window.location.href = 'pay.html'; }, 1200);
}

// 이미 로그인 + 결제된 상태라면 바로 study.html로
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    const { data: profile } = await supabaseClient
      .from('profiles').select('is_paid').eq('id', session.user.id).single();
    if (profile && profile.is_paid) window.location.href = 'study.html';
  }
})();
</script>
</body>
</html>
