<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>무료 체험 | 차이나 라이센스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt:#23272b; --sign:#0e7a55; --sign-deep:#0a5c41; --yellow:#f5c400; --red:#d6262b;
    --bg:#f2f5f3; --panel:#ffffff; --panel2:#eef2ef; --accent:#0e7a55;
    --accent2:#0e7a55; --danger:#d6262b; --text:#1b1f22; --muted:#5b6469; --border:#d3dad6;
    --pick:#fff3bf;
    --display:"Black Han Sans","Noto Sans KR",sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo',sans-serif; overflow-x:hidden; }
  .app { max-width:820px; margin:0 auto; padding:20px 16px 60px; width:100%; }
  h1 { font-size:clamp(16px,4.2vw,20px); margin:4px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .sectiontabs { display:flex; gap:8px; margin-bottom:10px; }
  .sectiontab { flex:1; text-align:center; background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:600; }
  .sectiontab.active { background:var(--pick); border-color:var(--accent); }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:10px; cursor:pointer; font-size:14px; }
  .tab.active { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .stats { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:13px; flex:1; min-width:90px; text-align:center; }
  .stat b { display:block; font-size:18px; margin-top:2px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px; }
  .qno { color:var(--accent); font-size:12px; font-weight:700; margin-bottom:6px; }
  .qtext { font-size:16px; line-height:1.55; margin-bottom:12px; white-space:pre-wrap; word-break:break-word; overflow-wrap:break-word; }
  .qimg { max-width:100%; height:auto; border-radius:10px; margin-bottom:12px; display:block; border:1px solid var(--border); }
  .choices { display:flex; flex-direction:column; gap:8px; }
  .choice { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; cursor:pointer; font-size:14.5px; display:flex; gap:8px; word-break:break-word; overflow-wrap:break-word; }
  .choice:hover { border-color:var(--accent); }
  .choice.correct { background:rgba(14,122,85,.14); border-color:var(--accent2); }
  .choice.wrong { background:rgba(214,38,43,.12); border-color:var(--danger); }
  .choice b { color:var(--accent); min-width:16px; flex-shrink:0; }
  .choice span { min-width:0; flex:1; }
  .tf-row { display:flex; gap:10px; }
  .tf-btn { flex:1; text-align:center; padding:12px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); cursor:pointer; font-weight:700; }
  .tf-btn.correct { background:rgba(14,122,85,.14); border-color:var(--accent2); }
  .tf-btn.wrong { background:rgba(214,38,43,.12); border-color:var(--danger); }
  .footer-row { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .btn { background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:9px; cursor:pointer; font-size:14px; font-weight:600; }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn:disabled { opacity:.4; cursor:default; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  .badge-note { color:#f59e0b; font-size:11.5px; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
  .progressbar { height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-bottom:14px; }
  .progressbar > div { height:100%; background:var(--accent); }
  .choice.picked, .tf-btn.picked { background:var(--pick); border-color:var(--accent); }
  .examhead { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; position:sticky; top:0; z-index:20; background:var(--bg); padding:8px 0; }
  .navtitle { margin:14px 0 6px; font-size:13px; font-weight:700; }
  .navtitle span { font-weight:400; color:var(--muted); font-size:12px; }
  .timer { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; }
  .timer.warn { color:#d6262b; border-color:var(--danger); }
  .navgrid { display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-bottom:14px; }
  @media (max-width:520px){ .navgrid { grid-template-columns:repeat(8,1fr); } }
  @media (max-width:360px){ .navgrid { grid-template-columns:repeat(6,1fr); gap:4px; } }
  .navcell { text-align:center; font-size:11.5px; padding:6px 0; border-radius:7px; background:var(--panel2); border:1px solid var(--border); color:var(--muted); cursor:pointer; }
  .navcell.filled { background:var(--pick); color:var(--text); border-color:var(--accent); }
  .navcell.ok { background:rgba(14,122,85,.16); color:#0a5c41; border-color:var(--accent2); }
  .navcell.ng { background:rgba(214,38,43,.14); color:#9b1c20; border-color:var(--danger); }
  .navcell.cur { outline:2px solid var(--accent); }
  .result { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:14px; text-align:center; }
  .result.pass { border-color:var(--accent2); background:rgba(14,122,85,.08); }
  .result.fail { border-color:var(--danger); background:rgba(214,38,43,.07); }
  .rtitle { font-size:20px; font-weight:800; margin-bottom:4px; }
  .rscore { font-size:44px; font-weight:800; line-height:1.1; }
  .rscore span { font-size:16px; color:var(--muted); font-weight:600; }
  .rsub { color:var(--muted); font-size:13px; margin-top:6px; }
  .rsec { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .rsec > div { flex:1; min-width:78px; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:8px; font-size:11.5px; color:var(--muted); }
  .rsec b { display:block; font-size:16px; color:var(--text); margin-top:2px; }
  .rbtns { display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .history { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:var(--muted); }
  .hrow { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .hchip { padding:4px 9px; border-radius:20px; font-weight:700; font-size:12px; }
  .hchip.p { background:rgba(14,122,85,.14); color:#0a5c41; }
  .hchip.f { background:rgba(214,38,43,.13); color:#9b1c20; }
  .exambar { background:linear-gradient(90deg,var(--pick),#1f4d38); border:1px solid var(--accent); color:var(--text); padding:13px; border-radius:12px; cursor:pointer; font-weight:700; font-size:14.5px; text-align:center; margin-bottom:12px; }
  #fxlayer { position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
  .fxp { position:absolute; width:9px; height:14px; opacity:0; animation:fxfly 1.25s cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes fxfly {
    0% { transform:translate(-50%,-50%) scale(.4) rotate(0deg); opacity:1; }
    70% { opacity:1; }
    100% { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 90px)) scale(1) rotate(var(--rot)); opacity:0; }
  }
  .fxpop { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font-size:26px; font-weight:800;
           text-shadow:0 2px 0 #fff, 0 4px 18px rgba(255,255,255,.9); animation:fxpop 1.05s ease-out forwards; white-space:nowrap; }
  .fxpop.ok { color:#0e7a55; }
  .fxpop.ng { color:#d6262b; font-size:19px; }
  @keyframes fxpop {
    0% { transform:translate(-50%,-50%) scale(.5); opacity:0; }
    22% { transform:translate(-50%,-58%) scale(1.12); opacity:1; }
    45% { transform:translate(-50%,-58%) scale(1); opacity:1; }
    100% { transform:translate(-50%,-115%) scale(.95); opacity:0; }
  }
  .card.fx-ok { animation:fxok .6s ease-out; }
  @keyframes fxok {
    0% { box-shadow:0 0 0 0 rgba(14,122,85,0); }
    25% { box-shadow:0 0 0 4px rgba(14,122,85,.45); border-color:var(--accent2); }
    100% { box-shadow:0 0 0 0 rgba(14,122,85,0); }
  }
  .card.fx-ng { animation:fxng .45s ease-in-out; }
  @keyframes fxng {
    0%,100% { transform:translateX(0); }
    20% { transform:translateX(-7px); }
    40% { transform:translateX(6px); }
    60% { transform:translateX(-4px); }
    80% { transform:translateX(3px); }
  }
  .choice.correct, .tf-btn.correct { animation:fxglow .5s ease-out; }
  @keyframes fxglow { 0% { transform:scale(1); } 40% { transform:scale(1.035); } 100% { transform:scale(1); } }
  .fxbtn { background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 12px; cursor:pointer; font-size:14px; }
  .toprow { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}

  .topbar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:6px; }
  .topbar .user { font-size:12px; color:var(--muted); word-break:break-all; }
  .topbar .btn2 { background:transparent; border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; flex-shrink:0; }
  .tabs .btn2 { background:transparent; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; }
  .gate-screen { text-align:center; padding:80px 20px; color:var(--muted); }

  /* --- 반응형: 태블릿/PC에서는 좀 더 여유 있게, 아주 작은 폰에서는 더 촘촘하게 --- */
  @media (min-width:768px) {
    .app { max-width:900px; padding:32px 24px 70px; }
    h1 { font-size:22px; }
    .qtext { font-size:17px; }
    .choice, .tab, .sectiontab { font-size:15px; }
  }
  @media (min-width:1200px) {
    .app { max-width:960px; }
  }
  @media (max-width:380px) {
    .app { padding:14px 10px 50px; }
    .sectiontab { padding:8px 4px; font-size:12.5px; }
    .tab { padding:7px 10px; font-size:13px; }
    .stat { min-width:76px; padding:8px 10px; font-size:12px; }
    .card { padding:14px; }
    .qtext { font-size:15px; }
    .choice { padding:9px 10px; font-size:13.5px; }
    .rscore { font-size:36px; }
  }
  @media (orientation:landscape) and (max-height:480px) {
    .app { padding-top:10px; padding-bottom:30px; }
    .exambar { padding:9px; }
  }

  /* ================= 온보딩 팝업(오버레이) ================= */
  #onboardOverlay {
    position:fixed; inset:0; z-index:5000; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(35,39,43,.62);
    backdrop-filter:blur(7px) saturate(1.1); -webkit-backdrop-filter:blur(7px) saturate(1.1);
    animation:obFadeIn .22s ease-out;
  }
  @keyframes obFadeIn { from{opacity:0} to{opacity:1} }
  .onboard-modal {
    width:100%; max-width:420px;
    background:var(--panel);
    border:1px solid var(--border); border-radius:22px;
    padding:28px 22px 24px; text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,.35);
    animation:obPop .32s cubic-bezier(.22,.9,.3,1.25);
  }
  @keyframes obPop { from{ transform:translateY(22px) scale(.94); opacity:0;} to{ transform:translateY(0) scale(1); opacity:1;} }
  .onboard-greet { font-size:19px; font-weight:800; margin-bottom:4px; }
  .onboard-sub { color:var(--muted); font-size:13.5px; margin-bottom:20px; line-height:1.5; }
  .onboard-tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .onboard-tile {
    --tc:#0e7a55; position:relative; overflow:hidden;
    background:var(--panel2); border:1px solid var(--border); border-radius:16px;
    padding:20px 10px 14px; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .onboard-tile::before {
    content:''; position:absolute; inset:0; background:var(--tc); opacity:.16;
    -webkit-mask-image:radial-gradient(circle at 30% 20%, #000, transparent 70%);
    mask-image:radial-gradient(circle at 30% 20%, #000, transparent 70%);
    pointer-events:none;
  }
  .onboard-tile:hover, .onboard-tile:active {
    transform:translateY(-3px) scale(1.03);
    border-color:var(--tc);
    box-shadow:0 10px 24px rgba(0,0,0,.18);
  }
  .ot-icon { font-size:30px; margin-bottom:8px; position:relative; filter:drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
  .ot-title { font-weight:800; font-size:14.5px; position:relative; }
  .ot-sub { color:var(--muted); font-size:11px; margin-top:4px; position:relative; }
  .ot-arrow {
    position:absolute; right:10px; bottom:9px; font-size:14px; font-weight:800; color:var(--tc);
    opacity:0; transform:translateX(-5px); transition:opacity .15s ease, transform .15s ease;
  }
  .onboard-tile:hover .ot-arrow { opacity:1; transform:translateX(0); }
  .onboard-back { margin-top:16px; }
  .onboard-hint { margin-top:16px; font-size:12px; font-weight:700; color:var(--accent); }
  @media (max-width:380px) {
    .onboard-modal { padding:22px 16px 20px; border-radius:18px; }
    .ot-icon { font-size:26px; }
    .ot-title { font-size:13.5px; }
  }

  /* ===== 추가: 닫기 버튼 / 섹션 아이콘 / 통계 아이콘 / 홈 버튼 / 푸터 ===== */
  .onboard-modal { position:relative; }
  .ob-close { position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:16px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .ob-close:hover { color:var(--text); border-color:var(--accent); }
  .sectiontab { display:flex; flex-direction:column; align-items:center; gap:3px; line-height:1.3; }
  .sectiontab .st-ic { font-size:20px; line-height:1; }
  .stat .stat-ic { display:block; margin:0 auto 4px; line-height:0; }
  .stat .stat-ic svg { width:22px; height:22px; }
  .stat .stat-ic.tried { color:var(--accent); } .stat .stat-ic.ok { color:#0e7a55; } .stat .stat-ic.ng { color:#d6262b; }
  .topbar .home { display:inline-flex; align-items:center; gap:5px; }
  .topbar .home svg { width:15px; height:15px; }
  .site-footer { max-width:820px; margin:0 auto; padding:18px 16px 32px; border-top:1px solid var(--border);
    font-size:11.5px; color:var(--muted); line-height:1.7; text-align:center; }
  .site-footer a { color:inherit; }

  /* ===== 처음 화면(고속도로 표지판) 디자인 맞춤 ===== */
  :focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
  h1, .rtitle, .rscore, .onboard-greet { font-family:var(--display); font-weight:400; letter-spacing:-.01em; }
  .rtitle { font-size:24px; }
  .topbar { background:var(--asphalt); border-bottom:none; }
  .topbar .user { color:rgba(255,255,255,.75); }
  .topbar .btn2 { border-color:rgba(255,255,255,.55); color:#fff; }
  .topbar .btn2:hover { background:rgba(255,255,255,.14); }
  .sectiontab { border:2px solid var(--asphalt); background:#fff; color:var(--asphalt); }
  .sectiontab.active { background:var(--sign); border-color:var(--asphalt); color:#fff; }
  .tab { border:2px solid var(--asphalt); background:#fff; color:var(--asphalt); }
  .tab.active { background:var(--asphalt); border-color:var(--asphalt); color:#fff; }
  .stat, .timer, .history, .fxbtn { border:2px solid var(--asphalt); background:#fff; }
  .stat b { font-family:var(--display); font-weight:400; font-size:20px; }
  .card, .result { border:3px solid var(--asphalt); border-radius:14px; background:#fff; }
  .card .qno { color:var(--sign); }
  .choice, .tf-btn { background:#fff; border:2px solid var(--border); }
  .choice:hover { border-color:var(--asphalt); background:var(--panel2); }
  .choice.picked, .tf-btn.picked { background:var(--pick); border-color:var(--yellow); }
  .choice.correct, .tf-btn.correct { background:rgba(14,122,85,.14); border-color:var(--sign); }
  .choice.wrong, .tf-btn.wrong { background:rgba(214,38,43,.10); border-color:var(--red); }
  .choice b { color:var(--sign); }
  .btn { background:var(--yellow); color:var(--asphalt); border:3px solid transparent; font-weight:700; border-radius:10px; }
  .btn:hover { background:#ffd633; }
  .btn.ghost { background:transparent; border:2px solid var(--asphalt); color:var(--asphalt); }
  .btn.ghost:hover { background:rgba(35,39,43,.08); }
  .progressbar { background:var(--border); height:8px; border-radius:4px; }
  .progressbar > div { background:var(--sign); }
  .timer.warn { color:var(--red); border-color:var(--red); }
  .navcell { background:#fff; border:2px solid var(--border); color:var(--muted); }
  .navcell.filled { background:var(--pick); border-color:var(--yellow); color:var(--asphalt); }
  .navcell.cur { outline:3px solid var(--asphalt); outline-offset:0; }
  .exambar { background:var(--sign); border:3px solid var(--asphalt); color:#fff; font-family:var(--display); font-weight:400; font-size:17px; box-shadow:0 0 0 3px #fff inset; }
  .exambar:hover { background:var(--sign-deep); }
  .result.pass { border-color:var(--sign); background:rgba(14,122,85,.08); }
  .result.fail { border-color:var(--red); background:rgba(214,38,43,.07); }
  .badge-note { color:#a86a00; }
  .examhead { background:var(--bg); }
  .onboard-modal { border:3px solid var(--asphalt); border-radius:20px; }
  .onboard-tile { border:2px solid var(--asphalt); }
  .onboard-tile::before { opacity:.22; }
  .onboard-hint { color:var(--sign); }
  .ob-close { background:#fff; border:2px solid var(--asphalt); color:var(--asphalt); }
  .site-footer { background:#171a1d; color:#aab2b7; border-top:none; max-width:none; }
  .site-footer a { color:#dfe4e7; }

  /* ===== 글씨 크기 키움 (처음 화면 기준: 본문 16~18px) ===== */
  body { font-size:16px; line-height:1.65; }
  h1 { font-size:clamp(22px,5.4vw,30px); line-height:1.3; }
  .sub { font-size:15px; }
  .topbar .user { font-size:14px; }
  .topbar .btn2, .tabs .btn2 { font-size:14px; padding:8px 14px; }
  .sectiontab { font-size:16px; padding:12px 8px; }
  .sectiontab .st-ic { font-size:24px; }
  .tab { font-size:16px; padding:10px 16px; }
  .stat { font-size:14.5px; padding:12px 14px; }
  .stat b { font-size:24px; }
  .card { padding:22px 20px; }
  .qno { font-size:14px; }
  .qtext { font-size:19px; line-height:1.6; margin-bottom:16px; }
  .choices { gap:10px; }
  .choice { font-size:17px; padding:14px 14px; gap:10px; line-height:1.55; }
  .choice b { min-width:20px; }
  .tf-btn { font-size:18px; padding:16px; }
  .btn { font-size:16.5px; padding:12px 20px; }
  .fxbtn { font-size:16px; }
  .note { font-size:15px; margin-top:10px; }
  .badge-note { font-size:13.5px; }
  .empty { font-size:16px; }
  .timer { font-size:20px; padding:11px 16px; }
  .navtitle { font-size:15px; }
  .navtitle span { font-size:13.5px; }
  .navcell { font-size:14px; padding:9px 0; }
  .rtitle { font-size:28px; }
  .rscore { font-size:56px; }
  .rscore span { font-size:19px; }
  .rsub { font-size:15px; }
  .rsec > div { font-size:13.5px; padding:10px; }
  .rsec b { font-size:19px; }
  .history { font-size:14.5px; }
  .hchip { font-size:14px; padding:5px 11px; }
  .exambar { font-size:19px; padding:16px; }
  .gate-screen { font-size:16px; }
  .onboard-greet { font-size:24px; }
  .onboard-sub { font-size:16px; }

<script>
// 무료 체험: 로그인 없이 is_free=true 문제(20개)만 풀어보는 페이지.
// 서버(RLS)가 is_free 문제만 내려주므로, 여기서 아무리 조작해도 유료 문제는 받을 수 없음.
const TRIAL_KEY = 'trial_state_v1';
let QUESTIONS = [];
let ctaHref = 'login.html#signup';
let ctaLabel = '전체 문제 풀어보기 · 3일 이용권';
let state = { idx: 0, answered: {}, done: false };

function saveState(){ try { localStorage.setItem(TRIAL_KEY, JSON.stringify(state)); } catch(e){} }
function loadState(){
  try {
    const v = localStorage.getItem(TRIAL_KEY);
    if (v) { const s = JSON.parse(v); if (s && typeof s === 'object') state = Object.assign(state, s); }
  } catch(e){}
}

async function loadQuestions(){
  const { data, error } = await supabaseClient
    .from('questions')
    .select('no, sec, orig_no, cat, q, choices, tf, ans, img, img_data, note')
    .eq('is_free', true)
    .order('no', { ascending: true });
  if (error || !data || data.length === 0) {
    document.getElementById('app').innerHTML =
      '<div class="empty">체험 문제를 불러오지 못했어요.<br>잠시 후 다시 시도해주세요.' +
      (error ? '<br><span style="font-size:13px;color:var(--muted)">' + error.message + '</span>' : '') + '</div>';
    throw error || new Error('no free questions');
  }
  QUESTIONS = data.map(function(r){
    return { no: r.no, sec: r.sec, origNo: r.orig_no, cat: r.cat, q: r.q, choices: r.choices,
             tf: r.tf, ans: r.ans, img: r.img, imgData: r.img_data, note: r.note };
  });
}

// window.storage 셰임: localStorage 기반
window.storage = {
  get: async (key) => { try { const v = localStorage.getItem(key); return v === null ? null : { value: v }; } catch(e) { return null; } },
  set: async (key, value) => { try { localStorage.setItem(key, value); return { value }; } catch(e) { return null; } }
};

/* ================= 효과음 & 시각 효과 ================= */
let fxOn = true;
let fxCtx = null;
let streak = 0;

async function loadFxPref(){
  try { const r = await window.storage.get('fx_sound', false); if (r && r.value !== undefined && r.value !== null) fxOn = (r.value === 'on' || r.value === true); } catch(e) {}
  if (QUESTIONS.length) render();
}
function toggleFx(){
  fxOn = !fxOn;
  try { window.storage.set('fx_sound', fxOn ? 'on' : 'off', false); } catch(e) {}
  if (fxOn) beep([880], 0.10, 'triangle', 0.18);
  render();
}
function ac(){
  if (!fxCtx) { try { fxCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } }
  if (fxCtx && fxCtx.state === 'suspended') { try { fxCtx.resume(); } catch(e){} }
  return fxCtx;
}
function tone(freq, start, dur, type, vol){
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, c.currentTime + start);
  g.gain.setValueAtTime(0.0001, c.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, c.currentTime + start + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
}
function beep(freqs, dur, type, vol, gap){
  if (!fxOn) return;
  freqs.forEach(function(f, i){ tone(f, i * (gap === undefined ? 0.085 : gap), dur, type, vol); });
}
function sndCorrect(){ beep([659.25, 830.61, 987.77, 1318.51], 0.22, 'triangle', 0.22, 0.075); }
function sndWrong(){ beep([207.65, 155.56], 0.26, 'sine', 0.16, 0.10); }
function sndTick(){ beep([1046.5], 0.05, 'triangle', 0.09); }
function sndFanfare(){ beep([523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.51], 0.35, 'triangle', 0.22, 0.13); }

/* --- 엔진음(부릉) 효과음: 온보딩 선택 때 사용 --- */
function noiseBuffer(c, dur){
  const n = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function engineRev(startDelay, dur, freqFrom, freqTo, vol){
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + startDelay;

  // 톤 레이어: 중음역대 사각파 + 빠른 피치 스윕(엔진 회전 느낌), 로우패스로 부드럽게
  const o = c.createOscillator(), og = c.createGain(), lp = c.createBiquadFilter();
  o.type = 'square';
  o.frequency.setValueAtTime(freqFrom, t0);
  o.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur * 0.5);
  o.frequency.exponentialRampToValueAtTime(freqFrom * 0.9, t0 + dur);
  lp.type = 'lowpass'; lp.frequency.value = 2200;
  og.gain.setValueAtTime(0.0001, t0);
  og.gain.exponentialRampToValueAtTime(vol * 0.55, t0 + dur * 0.12);
  og.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(lp); lp.connect(og); og.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);

  // 노이즈 레이어: 배기/바람 질감 (밴드패스로 필터링해 씽씽거리는 느낌)
  const noise = c.createBufferSource();
  noise.buffer = noiseBuffer(c, dur);
  const bp = c.createBiquadFilter(), ng = c.createGain();
  bp.type = 'bandpass'; bp.Q.value = 5;
  bp.frequency.setValueAtTime(freqFrom * 1.6, t0);
  bp.frequency.exponentialRampToValueAtTime(freqTo * 1.6, t0 + dur * 0.5);
  bp.frequency.exponentialRampToValueAtTime(freqFrom * 1.3, t0 + dur);
  ng.gain.setValueAtTime(0.0001, t0);
  ng.gain.exponentialRampToValueAtTime(vol * 0.35, t0 + dur * 0.12);
  ng.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  noise.connect(bp); bp.connect(ng); ng.connect(c.destination);
  noise.start(t0); noise.stop(t0 + dur + 0.05);
}
function sndVroom(){ if (!fxOn) return; engineRev(0, 0.32, 170, 330, 0.22); }
function sndVroomVroom(){
  if (!fxOn) return;
  engineRev(0, 0.20, 170, 300, 0.20);
  engineRev(0.19, 0.20, 180, 320, 0.20);
  engineRev(0.40, 0.5, 200, 560, 0.24);
}

function fxLayer(){
  let l = document.getElementById('fxlayer');
  if (!l) { l = document.createElement('div'); l.id = 'fxlayer'; document.body.appendChild(l); }
  return l;
}
const FX_COLORS = ['#f5c400','#0e7a55','#d6262b','#23272b','#ffd633','#0a5c41'];
function confetti(n, big){
  const l = fxLayer();
  const cx = window.innerWidth / 2;
  const cy = big ? window.innerHeight * 0.32 : window.innerHeight * 0.42;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.className = 'fxp';
    const ang = Math.random() * Math.PI * 2;
    const dist = (big ? 140 : 90) + Math.random() * (big ? 260 : 170);
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = FX_COLORS[(Math.random() * FX_COLORS.length) | 0];
    p.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    p.style.setProperty('--dy', (Math.sin(ang) * dist - 40).toFixed(1) + 'px');
    p.style.setProperty('--rot', ((Math.random() * 720 - 360) | 0) + 'deg');
    p.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
    if (Math.random() < 0.4) p.style.borderRadius = '50%';
    l.appendChild(p);
    setTimeout(function(){ p.remove(); }, 1500);
  }
}
function popText(txt, cls){
  const l = fxLayer();
  const d = document.createElement('div');
  d.className = 'fxpop ' + (cls || '');
  d.textContent = txt;
  l.appendChild(d);
  setTimeout(function(){ d.remove(); }, 1100);
}
function flashCard(kind){
  const c = document.querySelector('.card');
  if (!c) return;
  c.classList.remove('fx-ok','fx-ng');
  void c.offsetWidth;
  c.classList.add(kind === 'ok' ? 'fx-ok' : 'fx-ng');
}
function fxCorrect(){
  streak++;
  sndCorrect();
  confetti(streak >= 5 ? 34 : 22, streak >= 5);
  let msg = '정답! 🎉';
  if (streak >= 10) msg = streak + '연속 정답! 🔥🔥';
  else if (streak >= 3) msg = streak + '연속 정답! 🔥';
  popText(msg, 'ok');
  flashCard('ok');
}
function fxWrong(){
  streak = 0;
  sndWrong();
  popText('아쉬워요 😅', 'ng');
  flashCard('ng');
}
function fxResult(pass){
  if (pass) { sndFanfare(); confetti(70, true); popText('합격! 🎉', 'ok'); }
  else { sndWrong(); }
}


function getQ(no){ return QUESTIONS.find(function(q){ return q.no === no; }); }

function choose(no, picked){
  const q = getQ(no);
  if (state.answered[no] !== undefined) return;
  state.answered[no] = picked;
  saveState();
  render();
  if (picked === q.ans) fxCorrect(); else fxWrong();
  clearTimeout(window._autoAdv);
  if (state.idx < QUESTIONS.length - 1) {
    window._autoAdv = setTimeout(next, picked === q.ans ? 1300 : 2000);
  }
}
function next(){ clearTimeout(window._autoAdv); if (state.idx < QUESTIONS.length - 1){ state.idx++; saveState(); render(); window.scrollTo(0,0); } }
function prev(){ clearTimeout(window._autoAdv); if (state.idx > 0){ state.idx--; saveState(); render(); window.scrollTo(0,0); } }
function finish(){
  clearTimeout(window._autoAdv); state.done = true; saveState(); render(); window.scrollTo(0,0);
  const correct = QUESTIONS.filter(function(q){ return state.answered[q.no] === q.ans; }).length;
  const pct = correct / QUESTIONS.length * 100;
  if (pct >= 90) fxResult(true);
  else if (pct >= 70) { sndFanfare(); confetti(40, true); popText('잘했어요! 👏', 'ok'); }
  else { sndWrong(); }
}
function restart(){
  clearTimeout(window._autoAdv);
  state = { idx: 0, answered: {}, done: false };
  streak = 0;
  saveState(); render(); window.scrollTo(0,0);
}

function renderResult(){
  const total = QUESTIONS.length;
  const correct = QUESTIONS.filter(function(q){ return state.answered[q.no] === q.ans; }).length;
  const pct = Math.round(correct / total * 100);
  const pass = pct >= 90;
  let html = '';
  html += '<div class="result ' + (pass ? 'pass' : 'fail') + '">';
  html += '<div style="font-size:14px;color:var(--muted);margin-bottom:6px;">무료 체험 결과</div>';
  html += '<div class="rscore">' + correct + '<span> / ' + total + '</span></div>';
  html += '<div class="rmsg">정답률 ' + pct + '%<br>실제 시험은 100문제 중 <b>90점 이상</b>이 합격이에요.<br>' +
          (pass ? '좋은 출발이에요! 전체 문제로 마무리해볼까요? 🎉' : '틀린 문제는 전체 문제은행에서 오답노트로 모아 다시 풀 수 있어요.') + '</div>';
  html += '</div>';

  html += '<div class="cta-box">';
  html += '<ul class="unlock-list">' +
          '<li>전체 897문제 (1~4부)</li>' +
          '<li>모의고사 100문제 · 45분</li>' +
          '<li>오답노트로 틀린 문제만 복습</li>' +
          '</ul>';
  html += '<p>3일(72시간) 이용권 <b>20,000원</b> · 1회 결제, 자동결제 없음</p>';
  html += '<a class="cta-btn" href="' + ctaHref + '">' + ctaLabel + '</a>';
  html += '<a class="cta-sub" href="javascript:void(0)" onclick="restart()">체험 다시 풀기</a>';
  html += '</div>';

  html += '<div class="card" style="margin-top:16px;"><div style="font-weight:700;margin-bottom:8px;">푼 문제 한눈에 보기</div><div class="note" style="margin:0 0 8px;">초록 = 정답, 빨강 = 오답, 회색 = 안 푼 문제</div><div style="display:flex;flex-wrap:wrap;gap:6px;">';
  QUESTIONS.forEach(function(q, i){
    const p = state.answered[q.no];
    const bg = p === undefined ? '#cfd6d2' : (p === q.ans ? '#0e7a55' : '#d6262b');
    html += '<button onclick="goTo(' + i + ')" style="width:38px;height:38px;border-radius:8px;border:none;background:' + bg + ';color:#fff;font-weight:700;cursor:pointer;">' + (i+1) + '</button>';
  });
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}
function goTo(i){ clearTimeout(window._autoAdv); state.done = false; state.idx = i; saveState(); render(); window.scrollTo(0,0); }

function render(){
  const app = document.getElementById('app');
  if (!QUESTIONS.length) return;
  if (state.done) { renderResult(); return; }
  if (state.idx >= QUESTIONS.length) state.idx = 0;

  const total = QUESTIONS.length;
  const answeredCount = QUESTIONS.filter(function(q){ return state.answered[q.no] !== undefined; }).length;
  const q = QUESTIONS[state.idx];
  const picked = state.answered[q.no];
  const isLast = state.idx === total - 1;

  let html = '';
  html += '<div class="toprow"><h1 style="margin:0">🚗 무료 체험 문제</h1><button class="fxbtn" onclick="toggleFx()">' + (fxOn ? '🔊 효과음 켬' : '🔇 효과음 끔') + '</button></div>';
  html += '<div class="sub">로그인 없이 20문제를 풀어보세요 · 푼 문제 ' + answeredCount + ' / ' + total + '</div>';
  html += '<div class="progressbar"><div style="width:' + Math.round(((state.idx+1)/total)*100) + '%"></div></div>';
  html += '<div class="toprow"><div class="note">' + (state.idx+1) + ' / ' + total + '</div></div>';
  html += '<div class="card">';
  html += '<div class="qno">문제 ' + q.origNo + '번' + (q.cat ? ' · ' + q.cat : '') + '</div>';
  html += '<div class="qtext">' + q.q + '</div>';
  if (q.imgData) html += '<img class="qimg" src="data:image/jpeg;base64,' + q.imgData + '">';
  else if (q.img) html += '<div class="badge-note">🖼 ' + q.img + ' (이미지 준비중)</div>';

  if (q.tf) {
    html += '<div class="tf-row">';
    ['Y','N'].forEach(function(v){
      let cls = '';
      if (picked) { if (v === q.ans) cls = 'correct'; else if (v === picked) cls = 'wrong'; }
      html += '<div class="tf-btn ' + cls + '" onclick="' + (picked ? '' : 'choose(' + q.no + ',\'' + v + '\')') + '">' + (v === 'Y' ? '⭕ 맞다 (Y)' : '❌ 틀리다 (N)') + '</div>';
    });
    html += '</div>';
  } else if (q.choices) {
    html += '<div class="choices">';
    Object.keys(q.choices).forEach(function(k){
      let cls = '';
      if (picked) { if (k === q.ans) cls = 'correct'; else if (k === picked) cls = 'wrong'; }
      html += '<div class="choice ' + cls + '" onclick="' + (picked ? '' : 'choose(' + q.no + ',\'' + k + '\')') + '"><b>' + k + '</b><span>' + q.choices[k] + '</span></div>';
    });
    html += '</div>';
  }
  if (picked) {
    html += '<div class="note">정답: <b style="color:#0e7a55">' + q.ans + '</b>' + (picked === q.ans ? ' · 정답입니다! 🎉' : ' · 아쉬워요, 다음 문제로!') + '</div>';
  }
  if (q.note) html += '<div class="badge-note">⚠ ' + q.note + '</div>';
  html += '<div class="footer-row">';
  html += '<button class="btn ghost" onclick="prev()" ' + (state.idx === 0 ? 'disabled' : '') + '>← 이전</button>';
  if (isLast) html += '<button class="btn" onclick="finish()">결과 보기 →</button>';
  else html += '<button class="btn" onclick="next()">다음 →</button>';
  html += '</div></div>';
  if (answeredCount === total && !isLast) {
    html += '<div style="text-align:center;margin-top:6px;"><button class="btn" onclick="finish()">다 풀었어요! 결과 보기</button></div>';
  }
  app.innerHTML = html;
}

document.addEventListener('keydown', function(e){
  if (state.done) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
});

// 이미 로그인한 사람이면 CTA를 결제/이어서 풀기로 바꿔줌
async function adaptCta(){
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;
    const login = document.getElementById('topLogin');
    if (login) { login.textContent = '내 학습'; login.href = 'study.html'; }
    const { data: p } = await supabaseClient.from('profiles').select('paid_until').eq('id', session.user.id).single();
    const active = p && p.paid_until && new Date(p.paid_until) > new Date();
    ctaHref = active ? 'study.html' : 'pay.html';
    ctaLabel = active ? '전체 문제 이어서 풀기' : '결제하고 전체 문제 풀기';
    if (state.done) render();
  } catch(e){}
}

(async () => {
  loadState();
  try { await loadQuestions(); } catch(e) { return; }
  render();
  loadFxPref();
  adaptCta();
})();
</script>
</body>
