<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 | 중국 운전면허 문제은행</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.tosspayments.com/v1/payment-widget"></script>
</head>
<body>
<div class="wrap wide">
  <div class="logo">
    <div class="icon">🔓</div>
    <h1>전체 문제은행 이용권</h1>
    <p>결제 후 즉시 332개 전 문제 학습이 가능합니다</p>
  </div>

  <div class="plan-card">
    <div class="price">₩9,900 <span>/ 1년간 이용</span></div>
    <ul class="plan-list">
      <li>과목별 연습모드 전체 문제 풀이</li>
      <li>랜덤 모의고사</li>
      <li>오답노트 자동 저장 · 다시 풀기</li>
      <li>진도 자동 저장 (기기 상관없이 로그인만 하면 이어서 학습)</li>
    </ul>
  </div>

  <div class="card">
    <div id="payment-widget"></div>
    <div id="agreement" style="margin-top:12px;"></div>
    <button class="btn" id="payBtn" onclick="requestPayment()">₩9,900 결제하기</button>
    <button class="btn ghost" onclick="logout()">다른 계정으로 로그인</button>
    <div class="msg" id="payMsg"></div>
  </div>

  <div class="foot-note">
    테스트 환경에서는 실제 카드가 결제되지 않습니다.<br>
    결제 관련 문의는 사이트 하단 연락처로 문의해주세요.
  </div>
</div>

<script src="js/supabaseClient.js"></script>
<script>
const TOSS_CLIENT_KEY = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
const AMOUNT = 9900;

let paymentWidget;
let currentSession;

(async () => {
  currentSession = await requireLogin();
  if (!currentSession) return;

  const { data: profile } = await supabaseClient
    .from('profiles').select('is_paid, paid_until').eq('id', currentSession.user.id).single();
  const isActive = profile && profile.paid_until && new Date(profile.paid_until) > new Date();
  if (isActive) { window.location.href = 'study.html'; return; }

  const customerKey = currentSession.user.id;
  paymentWidget = PaymentWidget(TOSS_CLIENT_KEY, customerKey);
  paymentWidget.renderPaymentMethods('#payment-widget', { value: AMOUNT });
  paymentWidget.renderAgreement('#agreement');
})();

async function requestPayment() {
  if (!paymentWidget) return;
  const orderId = 'order_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

  try {
    await paymentWidget.requestPayment({
      orderId,
      orderName: '중국 운전면허 문제은행 이용권',
      customerEmail: currentSession.user.email,
      successUrl: window.location.origin + '/payment-success.html',
      failUrl: window.location.origin + '/payment-fail.html',
    });
  } catch (e) {
    document.getElementById('payMsg').className = 'msg error';
    document.getElementById('payMsg').textContent = '결제창 호출 실패: ' + (e && e.message ? e.message : e);
  }
}
</script>
</body>
</html>
