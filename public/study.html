<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중국 운전면허 문제은행</title>
<style>
  :root {
    --bg: #0f1420; --panel:#171d2c; --panel2:#1e2536; --accent:#4f8cff;
    --accent2:#22c55e; --danger:#ef4444; --text:#e8ecf5; --muted:#8b93a7; --border:#2a3247;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  .app { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:4px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:10px; cursor:pointer; font-size:14px; }
  .tab.active { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .stats { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:13px; flex:1; min-width:90px; text-align:center; }
  .stat b { display:block; font-size:18px; margin-top:2px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px; }
  .qno { color:var(--accent); font-size:12px; font-weight:700; margin-bottom:6px; }
  .qtext { font-size:16px; line-height:1.55; margin-bottom:12px; white-space:pre-wrap; }
  .imgtag { display:inline-block; background:#2a3247; color:var(--muted); font-size:12px; padding:3px 8px; border-radius:6px; margin-bottom:8px; }
  .choices { display:flex; flex-direction:column; gap:8px; }
  .choice { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; cursor:pointer; font-size:14.5px; display:flex; gap:8px; }
  .choice:hover { border-color:var(--accent); }
  .choice.correct { background:rgba(34,197,94,.18); border-color:var(--accent2); }
  .choice.wrong { background:rgba(239,68,68,.18); border-color:var(--danger); }
  .choice b { color:var(--accent); min-width:16px; }
  .tf-row { display:flex; gap:10px; }
  .tf-btn { flex:1; text-align:center; padding:12px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); cursor:pointer; font-weight:700; }
  .tf-btn.correct { background:rgba(34,197,94,.18); border-color:var(--accent2); }
  .tf-btn.wrong { background:rgba(239,68,68,.18); border-color:var(--danger); }
  .footer-row { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .btn { background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:9px; cursor:pointer; font-size:14px; font-weight:600; }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn:disabled { opacity:.4; cursor:default; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  .badge-note { color:#f59e0b; font-size:11.5px; }
  select, input[type=text] { background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; font-size:14px; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
  .progressbar { height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-bottom:14px; }
  .progressbar > div { height:100%; background:var(--accent); }
  .toprow { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); }
  .topbar .user { font-size:12px; color:var(--muted); }
  .topbar .btn2 { background:transparent; border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; }
  .gate-screen { text-align:center; padding:80px 20px; color:var(--muted); }
</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none;">
  <div class="user" id="userEmail"></div>
  <button class="btn2" onclick="logout()">로그아웃</button>
</div>
<div class="app" id="app">
  <div class="gate-screen">회원 확인 중...</div>
</div>

<script>
const QUESTIONS = [{"no": 1, "cat": "법규", "q": "운전 중 도로교통안전법 위반은 어떤 행위에 해당하는가?", "choices": {"A": "법규위반행위", "B": "위법행위", "C": "과실행위", "D": "규정위반행위"}, "ans": "B"}, {"no": 2, "cat": "법규", "q": "운전자의 법규위반으로 교통사고를 야기했을 경우, 어떤 법적 책임을 묻는가?", "choices": {"A": "형사책임", "B": "직접적 책임", "C": "민사책임", "D": "경제적 책임"}, "ans": "A"}, {"no": 3, "cat": "법규", "q": "교통사고 후 도주로 운전면허 취소된 후 운전면허 시험에 다시 응시할 수 없는 기간은?", "choices": {"A": "10년", "B": "평생", "C": "20년", "D": "5년"}, "ans": "B"}, {"no": 4, "cat": "법규", "q": "도로교통안전법 및 법규 위반으로 인한 사고 유발은 교통위반행위에 속한다.", "tf": true, "ans": "N"}, {"no": 5, "cat": "법규", "q": "운전 중 도로주행 규정을 위반한 경우 상응하는 처벌을 받아야 한다.", "tf": true, "ans": "Y"}, {"no": 6, "cat": "법규", "q": "운전면허 미 취득자가 운전을 할 경우 엄격 책임을 묻는다.", "tf": true, "ans": "Y"}, {"no": 7, "cat": "법규", "q": "교통사고 위반으로 중대교통사고를 초래했을 경우 그 형사책임을 묻지 않는다.", "tf": true, "ans": "N"}, {"no": 8, "cat": "법규", "q": "교통사고 후 도주한 운전자는 면허가 취소되면 평생 면허증을 다시 취득할 수 없다.", "ans": "Y", "tf": true}, {"no": 9, "cat": "법규", "q": "도로 주행 중 교통안전법규를 위반한 행위는 위법행위에 속한다.", "tf": true, "ans": "Y"}, {"no": 10, "cat": "법규", "q": "운전 시 소지해야 하는 것은 다음 중 무엇인가?", "choices": {"A": "사원증", "B": "운전면허증", "C": "신분증", "D": "직업 자격증"}, "ans": "B"}, {"no": 11, "cat": "법규", "q": "운전면허 미 취득자가 도로 운전교습 시, 다음 중 옳은 것은?", "choices": {"A": "교습 차량으로 운전교사가 동승하지 않고 혼자 연습한다", "B": "교습 차량으로 운전교사가 함께 동승 지도한다", "C": "교습 차량으로 혼자 연습한다", "D": "개인차량으로 운전교사가 함께 동행 지도한다"}, "ans": "B"}, {"no": 12, "cat": "법규", "q": "운전면허를 처음 발급받은 후 실습기간은?", "choices": {"A": "18개월", "B": "16개월", "C": "6개월", "D": "12개월"}, "ans": "D"}, {"no": 13, "cat": "법규", "q": "실습 기간 운전자는 차량 후방에 어떤 표시를 부착해야 하나?", "choices": {"A": "통일된 디자인의 실습운전 표지", "B": "차량 간격 표지", "C": "주의 양보 표지", "D": "초보 운전 주의 표지"}, "ans": "A"}, {"no": 14, "cat": "법규", "q": "속임수, 뇌물 등 부정행위로 취득한 면허가 취소되었다. 면허시험을 다시 응시할 수 없는 기간은?", "choices": {"A": "5년", "B": "3년", "C": "1년", "D": "평생"}, "ans": "B"}, {"no": 15, "cat": "법규", "q": "운전자는 면허증에 명시된 차종에 따라 운전해야 한다.", "tf": true, "ans": "Y"}, {"no": 16, "cat": "법규", "q": "도로 주행 차량에 신분증을 소지하지 않은 경우 let state = {
  mode: 'study',
  idx: 0,
  order: [],
  answered: {},
  wrongSet: new Set(),
  loaded: false
};

async function loadProgress() {
  try {
    const r = await window.storage.get('wrong_set_v2', false);
    if (r && r.value) state.wrongSet = new Set(JSON.parse(r.value));
  } catch(e) {}
  try {
    const r2 = await window.storage.get('answered_map_v2', false);
    if (r2 && r2.value) state.answered = JSON.parse(r2.value);
  } catch(e) {}
  state.loaded = true;
  render();
}

async function saveWrong() {
  try { await window.storage.set('wrong_set_v2', JSON.stringify([...state.wrongSet]), false); } catch(e){}
}
async function saveAnswered() {
  try { await window.storage.set('answered_map_v2', JSON.stringify(state.answered), false); } catch(e){}
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function setMode(m) {
  state.mode = m;
  state.idx = 0;
  if (m === 'study') state.order = QUESTIONS.map(q=>q.no);
  else if (m === 'random') state.order = shuffle(QUESTIONS.map(q=>q.no));
  else if (m === 'wrong') state.order = QUESTIONS.filter(q=>state.wrongSet.has(q.no)).map(q=>q.no);
  render();
}

function getQ(no) { return QUESTIONS.find(q=>q.no===no); }

function choose(no, picked) {
  const q = getQ(no);
  const correct = q.ans;
  state.answered[no] = picked;
  if (picked !== correct) state.wrongSet.add(no);
  else state.wrongSet.delete(no);
  saveWrong(); saveAnswered();
  render();
}

function next() { if (state.idx < state.order.length-1){ state.idx++; render(); } }
function prev() { if (state.idx > 0){ state.idx--; render(); } }

function render() {
  const app = document.getElementById('app');
  if (!state.loaded) { app.innerHTML = '<div class="empty">불러오는 중...</div>'; return; }
  if (state.order.length === 0 && state.mode !== 'wrong') setMode(state.mode);

  const total = QUESTIONS.length;
  const answeredCount = Object.keys(state.answered).length;
  const wrongCount = state.wrongSet.size;
  const correctCount = Object.keys(state.answered).filter(no=>state.answered[no]===getQ(Number(no)).ans).length;

  let html = '';
  html += '<h1>🚗 중국 운전면허 문제은행 (과목1 · 자동차 유형)</h1>';
  html += '<div class="sub">1부 · 도로교통안전 법률과 법규 파트 · 1~332번 전체 수록 (검증 완료) — 도로교통안전 법률과 법규 섹션 100% 완료 · 전체 897문제 중 순차 확장 예정</div>';

  html += '<div class="tabs">';
  html += '<div class="tab ' + (state.mode==='study'?'active':'') + '" onclick="setMode(\'study\')">순서대로 학습</div>';
  html += '<div class="tab ' + (state.mode==='random'?'active':'') + '" onclick="setMode(\'random\')">랜덤 퀴즈</div>';
  html += '<div class="tab ' + (state.mode==='wrong'?'active':'') + '" onclick="setMode(\'wrong\')">오답노트 (' + wrongCount + ')</div>';
  html += '</div>';

  html += '<div class="stats">';
  html += '<div class="stat">풀어본 문제<b>' + answeredCount + ' / ' + total + '</b></div>';
  html += '<div class="stat">정답<b style="color:#22c55e">' + correctCount + '</b></div>';
  html += '<div class="stat">오답<b style="color:#ef4444">' + wrongCount + '</b></div>';
  html += '</div>';

  if (state.order.length === 0) {
    html += '<div class="empty">오답노트가 비어 있어요. 문제를 풀면서 틀린 것만 여기 모여요 👍</div>';
    app.innerHTML = html;
    return;
  }

  const no = state.order[state.idx];
  const q = getQ(no);
  const picked = state.answered[no];

  html += '<div class="progressbar"><div style="width:' + Math.round(((state.idx+1)/state.order.length)*100) + '%"></div></div>';
  html += '<div class="toprow"><div class="note">' + (state.idx+1) + ' / ' + state.order.length + '</div></div>';

  html += '<div class="card">';
  html += '<div class="qno">문제 ' + q.no + '번' + (q.cat ? ' · ' + q.cat : '') + '</div>';
  if (q.img) html += '<div class="imgtag">🖼 ' + q.img + ' (원본 PDF 이미지 참고)</div><br>';
  html += '<div class="qtext">' + q.q + '</div>';

  if (q.tf) {
    html += '<div class="tf-row">';
    ['Y','N'].forEach(v=>{
      let cls = '';
      if (picked) {
        if (v===q.ans) cls='correct';
        else if (v===picked && picked!==q.ans) cls='wrong';
      }
      html += '<div class="tf-btn ' + cls + '" onclick="' + (picked?'':'choose('+q.no+',\''+v+'\')') + '">' + (v==='Y'?'⭕ 맞다 (Y)':'❌ 틀리다 (N)') + '</div>';
    });
    html += '</div>';
  } else if (q.choices) {
    html += '<div class="choices">';
    Object.keys(q.choices).forEach(k=>{
      let cls = '';
      if (picked) {
        if (k===q.ans) cls='correct';
        else if (k===picked && picked!==q.ans) cls='wrong';
      }
      html += '<div class="choice ' + cls + '" onclick="' + (picked?'':'choose('+q.no+',\''+k+'\')') + '"><b>' + k + '</b><span>' + q.choices[k] + '</span></div>';
    });
    html += '</div>';
  }

  if (picked) {
    html += '<div class="note">정답: <b style="color:#22c55e">' + q.ans + '</b>' + (picked===q.ans ? ' · 정답입니다! 🎉' : ' · 오답노트에 저장됨') + '</div>';
  }
  if (q.note) html += '<div class="badge-note">⚠ ' + q.note + '</div>';

  html += '<div class="footer-row">';
  html += '<button class="btn ghost" onclick="prev()" ' + (state.idx===0?'disabled':'') + '>← 이전</button>';
  html += '<button class="btn" onclick="next()" ' + (state.idx===state.order.length-1?'disabled':'') + '>다음 →</button>';
  html += '</div>';
  html += '</div>';

  app.innerHTML = html;
}

(async () => {
  const result = await requirePaidMember(); // 로그인 안됨->index.html, 결제 안됨->pay.html 로 자동 이동
  if (!result) return;
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('userEmail').textContent = result.session.user.email;
  loadProgress();
})();
</script>
</body>
